# GNU Taler Merchant Backend — Sandbox Configuration
# The default merchant instance is created via API in entrypoint.sh.

[merchant]
CURRENCY = KUDOS
BASE_URL = http://localhost:8082/
SERVE = tcp
PORT = 8082

[merchantdb-postgres]
CONFIG = postgres://taler:taler@db:5432/merchant

# Exchange this merchant trusts.
# MASTER_KEY is injected into merchant-runtime.conf at first boot
# (after the exchange master key is known).
[merchant-exchange-kudos]
URL = http://localhost:8081/
CURRENCY = KUDOS

@INLINE@ /var/lib/taler-exchange-runtime/merchant-runtime.conf
