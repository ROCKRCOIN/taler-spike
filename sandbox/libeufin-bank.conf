# LibEufin Bank — Sandbox Configuration
# Acts as the test bank for exchange wire-outs and wallet withdrawals.
# Uses x-taler-bank wire method (no IBAN, no real bank).

[libeufin-bank]
CURRENCY = KUDOS
BASE_URL = http://localhost:8080/
SERVE = tcp
PORT = 8080

# Allow customers to spend beyond zero balance (no pre-funding of testuser needed)
DEFAULT_CUSTOMER_DEBT_LIMIT = KUDOS:200
DEFAULT_ADMIN_DEBT_LIMIT = KUDOS:1000000

# Allow wallet self-registration for scripted test wallets
ALLOW_REGISTRATION = YES

# Compat flag for older taler-wallet-cli versions
ALLOW_ACCOUNT_DELETION = YES

[libeufin-bankdb-postgres]
CONFIG = postgres://taler:taler@db:5432/bank
