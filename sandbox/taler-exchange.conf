# GNU Taler Exchange — Sandbox Configuration
# Currency and master key are set via environment / entrypoint.
# MASTER_PUBLIC_KEY is injected into exchange-runtime.conf at first boot.

[exchange]
CURRENCY = KUDOS
CURRENCY_ROUND_UNIT = KUDOS:0.01
TINY_AMOUNT = KUDOS:0.01
# Set high so KYC never triggers during spike tests
AML_THRESHOLD = KUDOS:1000000
BASE_URL = http://localhost:8081/
SERVE = tcp
PORT = 8081
# Key/revocation directories (must be writable by daemon user)
KEYDIR = /var/lib/taler-exchange-runtime/keys/
REVOCATION_DIR = /var/lib/taler-exchange-runtime/revocations/

# Runtime-generated file written by entrypoint.sh at first boot:
# Contains: MASTER_PUBLIC_KEY = <actual key>
@INLINE@ /var/lib/taler-exchange-runtime/exchange-runtime.conf

# Coin denomination configs generated by taler-harness at first boot:
@INLINE@ /var/lib/taler-exchange-runtime/kudos-coins.conf

[exchangedb-postgres]
CONFIG = postgres://taler:taler@db:5432/exchange

# Wire account: the exchange holds coins and wires to merchants via libeufin-bank
[exchange-account-1]
PAYTO_URI = payto://x-taler-bank/localhost:8080/exchange?receiver-name=Exchange
ENABLE_CREDIT = YES
ENABLE_DEBIT = YES

# Credentials for the exchange to authenticate to libeufin-bank's wire-gateway API
[exchange-accountcredentials-1]
WIRE_GATEWAY_AUTH_METHOD = basic
USERNAME = exchange
PASSWORD = exchangepw
WIRE_GATEWAY_URL = http://localhost:8080/accounts/exchange/taler-wire-gateway/
